<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hermit Crab Video</title>
    <link rel="stylesheet" href="ct2-level2.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function() {
            const $video = $('#hermitVideo');
            const $playPauseBtn = $('#playPause');
            const $back5Btn = $('#back5');
            const $forward5Btn = $('#forward5');
            const $captionDiv = $('#caption');

            // Hide native controls
            $video.prop('controls', false);

            // Caption data
            const captions = [
                { time: 1, text: "Hermit Crabs." },
                { time: 5, text: "Hermit crabs are decapod crustaceans of the superfamily Paguroidea. Most of the approximately 1,110 species possess an asymmetric abdomen concealed in a scavenged mollusc shell." },
                { time: 12, text: "As hermit crabs grow, they require larger shells. Since suitable intact gastropod shells are sometimes a limited resource, vigorous competition often occurs among hermit crabs for shells." },
                { time: 20, text: "Hermit crabs with too-small shells cannot grow as fast as those with well-fitting shells, and are more likely to be eaten if they cannot retract completely into the shell. Therefore, as the hermit crab grows in size, it must find a larger shell and abandon the previous one." },
                { time: 30, text: 'You can read more on <a class="caption-link" href="https://en.wikipedia.org/wiki/Hermit_crab" target="_blank">Wikipedia</a>' }
            ];

            $video.on('timeupdate', function() {
                const t = $video[0].currentTime;
                let idx = -1;
                for (let i = 0; i < captions.length; i++) {
                    if (t >= captions[i].time) idx = i;
                    else break;
                }
                $captionDiv.html(idx >= 0 ? captions[idx].text : '');
            });

            // Play/Pause button logic
            $playPauseBtn.on('click', function() {
                if ($video[0].paused || $video[0].ended) {
                    $video[0].play();
                    $playPauseBtn.text('Pause');
                } else {
                    $video[0].pause();
                    $playPauseBtn.text('Play');
                }
            });

            // Update button on play/pause
            $video.on('play', function() {
                $playPauseBtn.text('Pause');
            });
            $video.on('pause', function() {
                $playPauseBtn.text('Play');
            });

            // Seek buttons
            $back5Btn.on('click', function() {
                $video[0].currentTime = Math.max(0, $video[0].currentTime - 5);
            });
            $forward5Btn.on('click', function() {
                $video[0].currentTime = Math.min($video[0].duration, $video[0].currentTime + 5);
            });

            // When video ends, stay on last frame, reset play/pause button
            $video.on('ended', function() {
                $playPauseBtn.text('Play');
            });


        });
    </script>
</head>
<body>
    <div class="container">
        <div class="video-wrapper">
            <video id="hermitVideo" src="hermit-crab.mp4" preload="metadata"></video>
            <div class="controls">
                <button id="back5"><span class="material-symbols-outlined">replay_5</span></button>
                <button id="playPause"><span class="material-symbols-outlined">play_arrow</span></button>
                <button id="forward5"><span class="material-symbols-outlined">forward_5</span></button>
            </div>
            <div class="caption" id="caption"></div>
        </div>
    </div>
</body>
</html>
