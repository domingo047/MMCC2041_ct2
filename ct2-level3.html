<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coding Task 2 (Level 3)</title>
    <link rel="stylesheet" href="ct2-level3.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function() {
            $('#hermitVideo').prop('controls', false);

            const captions = [
                { time: 1, text: "Hermit Crabs.", large: true},
                { time: 5, text: "Hermit crabs are decapod crustaceans of the superfamily Paguroidea. Most of the approximately 1,110 species possess an asymmetric abdomen concealed in a scavenged mollusc shell." },
                { time: 12, text: "As hermit crabs grow, they require larger shells. Since suitable intact gastropod shells are sometimes a limited resource, vigorous competition often occurs among hermit crabs for shells." },
                { time: 20, text: "Hermit crabs with too-small shells cannot grow as fast as those with well-fitting shells, and are more likely to be eaten if they cannot retract completely into the shell. Therefore, as the hermit crab grows in size, it must find a larger shell and abandon the previous one." },
                { time: 30, text: 'You can read more on <a class="caption-link" href="https://en.wikipedia.org/wiki/Hermit_crab" target="_blank">Wikipedia</a>' }
            ];

            $('#hermitVideo').on('timeupdate', function() {
                let idx = -1;
                for (let i = 0; i < captions.length; i++) {
                    if (this.currentTime >= captions[i].time) idx = i;
                    else break;
                }
                if (idx >= 0) {
                    $('#caption')
                        .html(captions[idx].text)
                        .toggleClass('large', !!captions[idx].large);
                } else {
                    $('#caption').html('').removeClass('large');
                }
                if (this.duration) {
                    $('#videoProgress').attr('value', this.currentTime / this.duration);
                }
            });

            $('.video-wrapper').on('mouseenter', function() {
                $('.controls-overlay').css({opacity: 1});
            });

            $('.video-wrapper').on('mouseleave', function() {
                $('.controls-overlay').css({opacity: 0});
            });

            $('#playPause').on('click', function() {
                const video = $('#hermitVideo')[0];
                if (video.paused || video.ended) {
                    video.play();
                    $('#playPause').find('span').text('pause');
                } else {
                    video.pause();
                    $('#playPause').find('span').text('play_arrow');
                }
            });

            $('#back5').on('click', function() {
                const video = $('#hermitVideo')[0];
                video.currentTime = Math.max(0, video.currentTime - 5);
            });
            $('#forward5').on('click', function() {
                const video = $('#hermitVideo')[0];
                video.currentTime = Math.min(video.duration, video.currentTime + 5);
            });

            $('#hermitVideo').on('ended', function() {
                $('#playPause').find('span').text('play_arrow');
            });

            $('#videoProgress').on('click', function(event) {
                let clickLocationX = event.pageX;
                let offsetLeft = $('progress').offset().left;
                let progressWidth = $('progress').width();
                let fraction = (clickLocationX - offsetLeft) / progressWidth;
                let dur = $('#hermitVideo')[0].duration;
                $('progress').attr('value', fraction);
                $('#hermitVideo')[0].currentTime = dur * fraction;
            });
        });
    </script>
</head>

<body>
    <div class="container">
        <div class="video-wrapper">
            <div class="controls-overlay">
                <button id="back5"><span class="material-symbols-outlined">replay_5</span></button>
                <button id="playPause"><span class="material-symbols-outlined">play_arrow</span></button>
                <button id="forward5"><span class="material-symbols-outlined">forward_5</span></button>
            </div>
            <video id="hermitVideo" src="hermit-crab.mp4" preload="metadata"></video>
            <div id="caption" class="caption"></div>
            <progress id="videoProgress" max="1" value="0"></progress>
        </div>
    </div>
</body>
</html>
